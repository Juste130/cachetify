name: CI

# Every push to any branch is checked: pull requests in this repo come from its own branches,
# so they are covered without a separate pull_request trigger running everything twice.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `next build` runs with NODE_ENV=production, where src/server/config.js refuses to load
      # without its required variables. These are placeholders: the build only needs them to
      # be present, it never connects to the database or the chain. Real values live in Netlify.
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          MASTER_ENCRYPTION_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder
          JWT_REFRESH_SECRET: ci-placeholder
          GROQ_API_KEY: ci-placeholder
          POLYGON_RPC_URL: https://rpc-amoy.polygon.technology
          CONTRACT_MANAGER_ADDRESS: "0x0000000000000000000000000000000000000000"
          ADMIN_WALLET_ADDRESS: "0x0000000000000000000000000000000000000000"
          KYC_MOCK_MODE: "false"
          NEXT_TELEMETRY_DISABLED: "1"

  contracts:
    name: Smart contract (Hardhat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Test
        run: npm test
