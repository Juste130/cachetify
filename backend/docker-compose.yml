version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cachetify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cachetify
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (optional - uncomment to run backend in Docker)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: cachetify-backend
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://postgres:password@postgres:5432/cachetify
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

volumes:
  postgres_data:
# Redis retire : provisionne ici mais jamais utilise nulle part dans le code (le
# rate-limiter tourne en memoire du process, escrow-scheduler.js a delibrement evite
# Redis pour son verrou). Une infra fantome dans ce fichier induit en erreur un nouveau
# developpeur qui croirait Redis necessaire pour faire tourner l'app. A reintroduire
# explicitement si un vrai besoin de store partage apparait (scaling horizontal du
# rate-limiting, par exemple).
